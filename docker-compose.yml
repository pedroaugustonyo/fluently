services:
  api:
    container_name: fluently-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "${ASPNETCORE_URLS:-http://+:8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
